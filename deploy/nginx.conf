# Пример для отдельного сервера. Основной production этим файлом не меняется.
# Node слушает только localhost. Входящий X-Ychy-User снаружи не доверяется.

server {
    listen 80;
    server_name ychy-pro.ru;
    client_max_body_size 4m;
    charset utf-8;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ychy-User "";
    }
}
